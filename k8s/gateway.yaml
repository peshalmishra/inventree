# ============================================================
#  API Gateway — Deployment + LoadBalancer Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: peshal21/ims-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            # Kubernetes DNS names resolve to ClusterIP Services in the same namespace
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5002"
            - name: FRONTEND_URL
              value: "*"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: LoadBalancer        # Exposes the API Gateway to the browser / external clients
