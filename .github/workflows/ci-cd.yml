name: IMS Microservices CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Gateway
        uses: docker/build-push-action@v4
        with:
          context: ./gateway
          push: true
          tags: peshal21/ims-gateway:latest

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v4
        with:
          context: ./services/auth-service
          push: true
          tags: peshal21/ims-auth-service:latest

      - name: Build and Push Product Service
        uses: docker/build-push-action@v4
        with:
          context: ./services/product-service
          push: true
          tags: peshal21/ims-product-service:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: true
          tags: peshal21/ims-frontend:latest

      - name: Trigger Render redeploy — Gateway
        run: curl -s "${{ secrets.RENDER_GATEWAY_HOOK }}"

      - name: Trigger Render redeploy — Auth Service
        run: curl -s "${{ secrets.RENDER_AUTH_HOOK }}"

      - name: Trigger Render redeploy — Product Service
        run: curl -s "${{ secrets.RENDER_PRODUCT_HOOK }}"
